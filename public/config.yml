backend:
  name: github
  repo: maadhavsewasansthan1/maadhavsewasansthan
  branch: main
  auth_endpoint: api/auth

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

i18n:
  structure: single_file
  locales:
    - en
    - hi
  default_locale: en

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  # ───────────────────────────────────────────────
  # EVENTS
  # ───────────────────────────────────────────────
  - name: "events"
    label: "Events & Programmes"
    label_singular: "Event"
    folder: "content/data/events"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: "title"
    summary: "{{title.en}} — {{status}}"
    sortable_fields: ["date", "title.en"]
    view_groups:
      - label: "Status"
        field: status
    i18n: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        required: true
        i18n: true

      - label: "Short Summary (for cards, max 160 chars)"
        name: "summary"
        widget: "text"
        required: true
        i18n: true
        pattern: [".{0,160}", "Maximum 160 characters"]
        hint: "EN: Shown on event cards and social share previews."

      - label: "Date (YYYY-MM-DD)"
        name: "date"
        widget: "string"
        required: true
        i18n: duplicate
        hint: "Format: YYYY-MM-DD (e.g. 2026-11-16)"
        pattern: ["^[0-9]{4}-[0-9]{2}-[0-9]{2}$", "Must be in YYYY-MM-DD format"]

      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Upcoming", value: "upcoming" }
          - { label: "Past Event", value: "past" }
        default: "upcoming"
        required: true
        i18n: duplicate

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Health", value: "Health" }
          - { label: "Education", value: "Education" }
          - { label: "Livelihood", value: "Livelihood" }
          - { label: "Women's Empowerment", value: "Womens Empowerment" }
          - { label: "Care for Elders", value: "Care for Elders" }
          - { label: "Animal Welfare", value: "Animal Welfare" }
          - { label: "Support for Needy Families", value: "Support for Needy Families" }
          - { label: "Environment", value: "Environment" }
        required: true
        i18n: duplicate

      - label: "Location"
        name: "location"
        widget: "string"
        required: false
        i18n: true

      - label: "Description"
        name: "description"
        widget: "markdown"
        required: true
        i18n: true

      - label: "Cover Image"
        name: "image"
        widget: "image"
        required: false
        i18n: duplicate
        hint: "Landscape, at least 1200 px wide, under 500 KB. Accepted formats: JPG, PNG, WebP."
        media_library:
          config:
            multiple: false

      - label: "Registration / Details Link"
        name: "link"
        widget: "string"
        required: false
        i18n: duplicate

  # ───────────────────────────────────────────────
  # ACTIVITIES
  # ───────────────────────────────────────────────
  - name: "activities"
    label: "Activities & Stories"
    label_singular: "Activity"
    folder: "content/data/activities"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: "title"
    summary: "{{title.en}} — {{category}}"
    sortable_fields: ["date", "title.en", "category"]
    i18n: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        required: true
        i18n: true

      - label: "Short Summary (for cards, max 160 chars)"
        name: "summary"
        widget: "text"
        required: true
        i18n: true
        pattern: [".{0,160}", "Maximum 160 characters"]
        hint: "EN: Shown on activity cards and social share previews."

      - label: "Date (YYYY-MM-DD)"
        name: "date"
        widget: "string"
        required: false
        i18n: duplicate
        hint: "Format: YYYY-MM-DD (e.g. 2026-11-16)"
        pattern: ["^[0-9]{4}-[0-9]{2}-[0-9]{2}$", "Must be in YYYY-MM-DD format"]

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Health", value: "Health" }
          - { label: "Education", value: "Education" }
          - { label: "Livelihood", value: "Livelihood" }
          - { label: "Women's Empowerment", value: "Womens Empowerment" }
          - { label: "Care for Elders", value: "Care for Elders" }
          - { label: "Animal Welfare", value: "Animal Welfare" }
          - { label: "Support for Needy Families", value: "Support for Needy Families" }
          - { label: "Environment", value: "Environment" }
        required: true
        i18n: duplicate

      - label: "Body / Full Story"
        name: "body"
        widget: "markdown"
        required: false
        i18n: true

      - label: "Location"
        name: "location"
        widget: "string"
        required: false
        i18n: true

      - label: "Photos"
        name: "photos"
        widget: "list"
        required: false
        i18n: true
        hint: "Landscape, at least 1200 px wide, under 500 KB each. JPG, PNG, or WebP."
        field:
          label: "Photo"
          name: "photo"
          widget: "image"

  # ───────────────────────────────────────────────
  # GALLERY
  # ───────────────────────────────────────────────
  - name: "gallery"
    label: "Gallery Archive"
    label_singular: "Gallery Item"
    folder: "content/data/gallery"
    create: true
    format: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title.en}} — {{type}}"
    sortable_fields: ["date", "title.en", "type"]
    i18n: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        required: true
        i18n: true

      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Photo", value: "photo" }
          - { label: "Video", value: "video" }
        default: "photo"
        required: true
        i18n: duplicate

      - label: "Image / Thumbnail"
        name: "image"
        widget: "image"
        required: false
        i18n: duplicate
        hint: "Square or landscape, at least 800 px wide, under 400 KB. JPG, PNG, or WebP."
        media_library:
          config:
            multiple: false

      - label: "Video Link (YouTube or Facebook URL)"
        name: "videoUrl"
        widget: "string"
        required: false
        i18n: duplicate

      - label: "Caption"
        name: "caption"
        widget: "text"
        required: false
        i18n: true

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Health", value: "Health" }
          - { label: "Education", value: "Education" }
          - { label: "Environment", value: "Environment" }
          - { label: "Community", value: "Community" }
        required: true
        i18n: duplicate

      - label: "Date (YYYY-MM-DD)"
        name: "date"
        widget: "string"
        required: false
        i18n: duplicate
        hint: "Format: YYYY-MM-DD (e.g. 2026-11-16)"
        pattern: ["^[0-9]{4}-[0-9]{2}-[0-9]{2}$", "Must be in YYYY-MM-DD format"]

  # ───────────────────────────────────────────────
  # FOUNDER (file collection)
  # ───────────────────────────────────────────────
  - name: "founder"
    label: "Founder Profile"
    files:
      - name: "founder"
        label: "Founder Profile"
        file: "content/data/founder.json"
        format: "json"
        i18n: true
        fields:
          - label: "Name"
            name: "name"
            widget: "string"
            required: true
            i18n: true

          - label: "Role"
            name: "role"
            widget: "string"
            required: true
            i18n: true

          - label: "Photo"
            name: "photo"
            widget: "image"
            required: false
            i18n: duplicate
            hint: "Portrait, 4:5 ratio recommended. At least 600 px wide, under 400 KB. JPG or PNG."

          - label: "Photo Alt Text"
            name: "photoAlt"
            widget: "string"
            required: false
            i18n: true

          - label: "Bio Paragraphs"
            name: "bio"
            widget: "list"
            required: false
            i18n: true
            field:
              label: "Paragraph"
              name: "paragraph"
              widget: "text"

          - label: "Quote"
            name: "quote"
            widget: "text"
            required: false
            i18n: true

          - label: "Years of Service"
            name: "yearsOfService"
            widget: "string"
            required: false
            i18n: duplicate

  # ───────────────────────────────────────────────
  # FOCUS AREAS (file collection)
  # ───────────────────────────────────────────────
  - name: "focus_areas"
    label: "Focus Areas"
    files:
      - name: "focus_areas"
        label: "Focus Areas"
        file: "content/data/focus_areas.json"
        format: "json"
        fields:
          - label: "Focus Areas List"
            name: "focus_areas"
            widget: "list"
            fields:
              - label: "Order"
                name: "order"
                widget: "number"
                value_type: "int"
              - label: "Icon Key"
                name: "icon"
                widget: "select"
                options: ["GraduationCap", "HeartPulse", "Sprout", "Users", "Leaf", "HandHeart"]
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi (कृपया प्रकाशित करने से पहले जाँचें)", name: "hi", widget: "string", hint: "Please review Hindi before publishing" }
              - label: "Description"
                name: "description"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Hindi (कृपया प्रकाशित करने से पहले जाँचें)", name: "hi", widget: "text", hint: "Please review Hindi before publishing" }
              - label: "Accent Color"
                name: "color"
                widget: "string"
                default: "#1F2A5C"

  # ───────────────────────────────────────────────
  # SITE SETTINGS (file collection)
  # ───────────────────────────────────────────────
  - name: "site_settings"
    label: "Site Settings & Details"
    files:
      - name: "site_settings"
        label: "Site Settings & Details"
        file: "content/data/site_settings.json"
        format: "json"
        fields:
          - { label: "Organization Name (English)", name: "name", widget: "string" }
          - { label: "Organization Name (Hindi)", name: "nameHindi", widget: "string", hint: "Please review Hindi before publishing" }
          - { label: "Email", name: "email", widget: "string" }
          - label: "Phone"
            name: "phone"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Hindi (कृपया जाँचें)", name: "hi", widget: "string", hint: "Please review Hindi before publishing" }
          - label: "Address"
            name: "address"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Hindi (कृपया जाँचें)", name: "hi", widget: "string", hint: "Please review Hindi before publishing" }
          - { label: "Facebook URL", name: "facebook_url", widget: "string" }
          - label: "Donation Note"
            name: "donation_note"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "text" }
              - { label: "Hindi (कृपया जाँचें)", name: "hi", widget: "text", hint: "Please review Hindi before publishing" }
          - label: "Impact Figures"
            name: "impact_figures"
            widget: "list"
            fields:
              - { label: "Figure / Value", name: "value", widget: "string" }
              - label: "Label"
                name: "label"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi (कृपया जाँचें)", name: "hi", widget: "string", hint: "Please review Hindi before publishing" }
              - label: "Description"
                name: "description"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Hindi (कृपया जाँचें)", name: "hi", widget: "text", hint: "Please review Hindi before publishing" }
              - { label: "Verified (Shows official number when ON)", name: "verified", widget: "boolean", default: false }
              - label: "Placeholder Note"
                name: "note"
                widget: "object"
                required: false
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi (कृपया जाँचें)", name: "hi", widget: "string", hint: "Please review Hindi before publishing" }

  # ───────────────────────────────────────────────
  # HOME PAGE & HERO (file collection)
  # ───────────────────────────────────────────────
  - name: "home"
    label: "Home Page & Hero"
    files:
      - name: "home"
        label: "Home Page & Hero"
        file: "content/data/home.json"
        format: "json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - label: "Badge"
                name: "badge"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi", name: "hi", widget: "string" }
              - label: "Headline"
                name: "headline"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi", name: "hi", widget: "string" }
              - { label: "Headline Subtitle (Hindi)", name: "headlineHindi", widget: "string" }
              - label: "Subheadline"
                name: "subheadline"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Hindi", name: "hi", widget: "text" }
              - label: "Hero Image"
                name: "heroImage"
                widget: "object"
                fields:
                  - { label: "Image", name: "src", widget: "image", hint: "Landscape, at least 1600 px wide, under 800 KB." }
                  - { label: "Alt Text", name: "alt", widget: "string" }
              - label: "Primary Button (CTA)"
                name: "primaryCta"
                widget: "object"
                fields:
                  - label: "Label"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Hindi", name: "hi", widget: "string" }
                  - { label: "Link URL", name: "href", widget: "string" }
              - label: "Secondary Button (CTA)"
                name: "secondaryCta"
                widget: "object"
                fields:
                  - label: "Label"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Hindi", name: "hi", widget: "string" }
                  - { label: "Link URL", name: "href", widget: "string" }
              - label: "Ticker Strip Items"
                name: "tickerItems"
                widget: "list"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi", name: "hi", widget: "string" }
              - label: "Trust Markers"
                name: "trustNotes"
                widget: "list"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi", name: "hi", widget: "string" }
              - label: "Floating Tags"
                name: "floatingTags"
                widget: "object"
                fields:
                  - label: "District Focus Title"
                    name: "districtFocus"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Hindi", name: "hi", widget: "string" }
                  - label: "District Description"
                    name: "districtDesc"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Hindi", name: "hi", widget: "string" }

          - label: "About Section Preview (Home Page)"
            name: "aboutPreview"
            widget: "object"
            fields:
              - label: "Badge"
                name: "badge"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi", name: "hi", widget: "string" }
              - label: "Headline"
                name: "headline"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi", name: "hi", widget: "string" }
              - label: "Body Paragraphs"
                name: "body"
                widget: "list"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Hindi", name: "hi", widget: "text" }
              - label: "Card Label"
                name: "cardLabel"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi", name: "hi", widget: "string" }
              - label: "Card Quote"
                name: "cardQuote"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi", name: "hi", widget: "string" }
              - label: "Card Note"
                name: "cardNote"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi", name: "hi", widget: "string" }

  # ───────────────────────────────────────────────
  # DONATIONS & BANK DETAILS (file collection)
  # ───────────────────────────────────────────────
  - name: "donate"
    label: "Donation, Bank & UPI"
    files:
      - name: "donate"
        label: "Donation, Bank & UPI"
        file: "content/data/donate.json"
        format: "json"
        fields:
          - label: "Badge"
            name: "badge"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Hindi", name: "hi", widget: "string" }
          - label: "Headline"
            name: "headline"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Hindi", name: "hi", widget: "string" }
          - { label: "Headline (Hindi Banner)", name: "headlineHindi", widget: "string" }
          - label: "Subheadline"
            name: "subheadline"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "text" }
              - { label: "Hindi", name: "hi", widget: "text" }
          - label: "Neutral Statement"
            name: "neutralStatement"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "text" }
              - { label: "Hindi", name: "hi", widget: "text" }
          - label: "Policy & Transparency Disclaimer"
            name: "disclaimer"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "text" }
              - { label: "Hindi", name: "hi", widget: "text" }
          - { label: "Show Bank Details Card Publicly", name: "showBankDetails", widget: "boolean", default: true }
          - label: "Bank Account Details"
            name: "bankAccount"
            widget: "object"
            fields:
              - { label: "Account Name", name: "accountName", widget: "string" }
              - { label: "Account Number", name: "accountNumber", widget: "string" }
              - { label: "IFSC Code", name: "ifsc", widget: "string" }
              - { label: "Bank Name", name: "bankName", widget: "string" }
              - { label: "Branch", name: "branch", widget: "string" }
          - { label: "UPI ID (e.g. madhavsewasansthan@sbi)", name: "upiId", widget: "string", required: false }
          - { label: "UPI QR Code Image", name: "qrCodePath", widget: "image", required: false, hint: "Upload official UPI QR code (Square PNG/JPG)" }
          - { label: "QR Code Alt Text", name: "qrAlt", widget: "string", default: "Official UPI QR Code" }
          - label: "Contact Note"
            name: "contactNote"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "text" }
              - { label: "Hindi", name: "hi", widget: "text" }

  # ───────────────────────────────────────────────
  # CONTACT DETAILS (file collection)
  # ───────────────────────────────────────────────
  - name: "contact"
    label: "Contact & Office Info"
    files:
      - name: "contact"
        label: "Contact & Office Info"
        file: "content/data/contact.json"
        format: "json"
        fields:
          - label: "Badge"
            name: "badge"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Hindi", name: "hi", widget: "string" }
          - label: "Headline"
            name: "headline"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Hindi", name: "hi", widget: "string" }
          - { label: "Headline (Hindi Banner)", name: "headlineHindi", widget: "string" }
          - label: "Description"
            name: "description"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "text" }
              - { label: "Hindi", name: "hi", widget: "text" }
          - { label: "Official Email", name: "email", widget: "string" }
          - label: "Phone Number"
            name: "phone"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Hindi", name: "hi", widget: "string" }
          - label: "Physical Address"
            name: "address"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Hindi", name: "hi", widget: "string" }
          - label: "Office Hours"
            name: "officeHours"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Hindi", name: "hi", widget: "string" }
          - { label: "Facebook Page URL", name: "facebookUrl", widget: "string" }
          - label: "Frequently Asked Questions (FAQ)"
            name: "faq"
            widget: "list"
            fields:
              - label: "Question"
                name: "question"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Hindi", name: "hi", widget: "string" }
              - label: "Answer"
                name: "answer"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Hindi", name: "hi", widget: "text" }

  # ───────────────────────────────────────────────
  # ABOUT PAGE (file collection)
  # ───────────────────────────────────────────────
  - name: "about"
    label: "About Page & Story"
    files:
      - name: "about"
        label: "About Page & Story"
        file: "content/data/about.json"
        format: "json"
        fields:
          - label: "Badge"
            name: "badge"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Hindi", name: "hi", widget: "string" }
          - label: "Headline"
            name: "headline"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Hindi", name: "hi", widget: "string" }
          - { label: "Headline (Hindi Banner)", name: "headlineHindi", widget: "string" }
          - label: "Subheadline"
            name: "subheadline"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "text" }
              - { label: "Hindi", name: "hi", widget: "text" }
          - label: "Mission Statement"
            name: "mission"
            widget: "object"
