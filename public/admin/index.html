<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Content Manager — Maadhav Sewa Sansthan</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <!-- Explicit CMS config URL -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <!-- Mobile-friendly admin stylesheet -->
    <link rel="stylesheet" href="/admin/custom.css" />
  </head>
  <body>

    <!-- Publish confirmation banner (shown after successful save) -->
    <div id="mss-publish-confirm">
      ✅ Published! It will appear on the website in 1–2 minutes.
    </div>

    <!-- Enable Decap manual init to inject dynamic base_url -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>

    <!-- Decap CMS (pinned stable release) -->
    <script src="https://unpkg.com/decap-cms@3.1.2/dist/decap-cms.js"></script>

    <script>
    (function () {
      /* ── 1. Init with dynamic base_url ── */
      var initCMS = window.init || (window.CMS && window.CMS.init);
      if (typeof initCMS === "function") {
        initCMS({
          config: {
            backend: {
              base_url: window.location.origin,
              auth_endpoint: "api/auth",
            },
          },
        });
      }

      /* ── 2. Event & Activity card preview template ── */
      var CMS = window.CMS;
      if (CMS && CMS.registerPreviewStyle) {
        CMS.registerPreviewStyle("/admin/custom.css");
      }

      var cardPreviewTemplate = function (props) {
        var entry   = props.entry;
        var getVal  = function (k) { return entry.getIn(["data", k]) || ""; };
        var title   = getVal("title") || "(No title yet)";
        var summary = getVal("summary") || "";
        var date    = getVal("date") || "";
        var status  = getVal("status") || "upcoming";
        var cat     = getVal("category") || "";
        var img     = getVal("image") || "";
        var statusLabel = status === "past" ? "Past Event" : "Upcoming";
        var statusColor = status === "past" ? "#5E4E3F" : "#1F5F63";

        var html = [
          '<div style="font-family:sans-serif;max-width:360px;border:1.5px solid #E2D2B3;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);background:#FFFDF8;">',
          img ? '<img src="' + img + '" style="width:100%;height:180px;object-fit:cover" />' : '<div style="width:100%;height:120px;background:#EFE3CC;display:flex;align-items:center;justify-content:center;color:#5E4E3F;font-size:13px">No image yet</div>',
          '<div style="padding:14px">',
          '<div style="display:flex;gap:8px;margin-bottom:8px">',
          '<span style="background:' + statusColor + ';color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px">' + statusLabel + '</span>',
          cat ? '<span style="background:#F2E4C9;color:#1F2A5C;font-size:11px;padding:3px 10px;border-radius:12px">' + cat + '</span>' : '',
          '</div>',
          '<h3 style="margin:0 0 6px;font-size:17px;color:#1F2A5C;font-weight:700;line-height:1.3">' + title + '</h3>',
          summary ? '<p style="margin:0 0 8px;font-size:14px;color:#5E4E3F;line-height:1.5">' + summary + '</p>' : '',
          date ? '<p style="margin:0;font-size:12px;color:#9B8C7A">📅 ' + date + '</p>' : '',
          '</div>',
          '</div>'
        ].join("");

        var d = document.createElement("div");
        d.innerHTML = html;
        return d.firstChild;
      };

      if (CMS && CMS.registerPreviewTemplate) {
        CMS.registerPreviewTemplate("events",     cardPreviewTemplate);
        CMS.registerPreviewTemplate("activities", cardPreviewTemplate);
      }

      /* ── 3. Publish confirmation banner ── */
      function showPublishConfirm() {
        var banner = document.getElementById("mss-publish-confirm");
        if (!banner) return;
        banner.style.display = "block";
        setTimeout(function () { banner.style.display = "none"; }, 5000);
      }

      window.addEventListener("message", function (e) {
        if (e.data && typeof e.data === "object") {
          var t = e.data.type || "";
          if (t === "ENTRY_PUBLISH" || t === "DRAFT_PUBLISHED") {
            showPublishConfirm();
          }
        }
      });

      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
          m.addedNodes.forEach(function (node) {
            if (node.nodeType !== 1) return;
            var text = (node.textContent || "").toLowerCase();
            if (text.includes("published") || text.includes("entry saved")) {
              showPublishConfirm();
            }
          });
        });
      });
      document.addEventListener("DOMContentLoaded", function () {
        observer.observe(document.body, { childList: true, subtree: true });
      });

      /* ── 4. Empty state and auto-fill defaults for new entries ── */
      function checkPageDecorations() {
        // Empty state check for empty lists
        var emptyContainers = document.querySelectorAll('[class*="e1d0i3na0"], [class*="NoEntriesMessage"]');
        emptyContainers.forEach(function (el) {
          if (!el.getAttribute("data-mss-customized")) {
            el.innerHTML = '<div style="text-align:center;padding:32px 16px;color:#5E4E3F;">' +
              '<p style="font-size:16px;font-weight:600;margin-bottom:8px;">No entries yet.</p>' +
              '<p style="font-size:14px;color:#8C7B68;">Tap <strong>New</strong> above to add one.</p>' +
              '</div>';
            el.setAttribute("data-mss-customized", "true");
          }
        });

        // Pre-fill date with today's date if empty on new entry
        var dateInputs = document.querySelectorAll('input[name="date"], input[id*="date"]');
        var today = new Date().toISOString().split("T")[0];
        dateInputs.forEach(function (input) {
          if (!input.value && !input.getAttribute("data-mss-prefilled")) {
            // Only autofill if in new entry view
            var isNew = window.location.hash.includes("/new");
            if (isNew) {
              input.value = today;
              input.dispatchEvent(new Event("input", { bubbles: true }));
              input.dispatchEvent(new Event("change", { bubbles: true }));
              input.setAttribute("data-mss-prefilled", "true");
            }
          }
        });
      }

      setInterval(checkPageDecorations, 1000);

    })();
    </script>
  </body>
</html>
