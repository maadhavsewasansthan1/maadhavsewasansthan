<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager — Maadhav Sewa Sansthan</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <!-- Explicit CMS config URL -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!-- Enable manual initialization to inject dynamic base_url -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <!-- Decap CMS official script (pinned stable release) -->
    <script src="https://unpkg.com/decap-cms@3.1.2/dist/decap-cms.js"></script>
    <script>
      (function () {
        const initCMS = window.init || (window.CMS && window.CMS.init);
        if (typeof initCMS === "function") {
          initCMS({
            config: {
              backend: {
                base_url: window.location.origin,
                auth_endpoint: "api/auth",
              },
            },
          });
        }
      })();
    </script>
  </body>
</html>
